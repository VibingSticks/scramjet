<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This site can’t be reached</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/index.css">
<style>
  html, body { margin: 0; height: 100%; }
  [hidden] { display: none !important; }

  /* ---- Facade: looks like a browser DNS error ---- */
  #error {
    position: fixed; inset: 0;
    background: #fff; color: #202124;
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: flex-start; justify-content: center;
  }
  #error .wrap { max-width: 600px; padding: 18vh 24px 0; width: 100%; }
  #error .glyph { width: 72px; height: 72px; opacity: .55; margin-bottom: 28px; }
  #error h1 { font-size: 22px; font-weight: 400; margin: 0 0 18px; }
  #error p { color: #5f6368; margin: 0 0 16px; }
  #error .code { color: #5f6368; font-size: 13px; letter-spacing: .02em; }
  #error .btn {
    margin-top: 26px; background: #1a73e8; color: #fff; border: 0;
    padding: 9px 16px; border-radius: 4px; font-size: 14px; cursor: pointer;
  }
  #error .hint { margin-top: 40px; color: #c7c7c7; font-size: 12px; user-select: none; }

  /* ---- Access accepted splash ---- */
  #accepted {
    position: fixed; inset: 0; background: #0b0e14; color: #d7f7e2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 500 20px system-ui, sans-serif; gap: 18px;
  }
  #accepted .ring {
    width: 34px; height: 34px; border: 3px solid #1e3a2b; border-top-color: #34d17a;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- The real proxy UI (Scramjet-style dark) ---- */
  #proxy { position: fixed; inset: 0; display: flex; flex-direction: column;
    background: #0d1017; color: #e6e9ef; font: 14px system-ui, sans-serif; }
  #proxy .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: #151a23; border-bottom: 1px solid #232a36; }
  #proxy .brand { font-weight: 700; letter-spacing: .04em; color: #8bb8ff; padding: 0 6px; }
  #proxy form { flex: 1; display: flex; }
  #proxy input { flex: 1; padding: 9px 12px; border-radius: 7px; border: 1px solid #2a323f;
    background: #0d1017; color: #e6e9ef; font-size: 14px; }
  #proxy input:focus { outline: none; border-color: #6ea8fe; }
  #proxy .url { padding: 4px 14px; font-size: 12px; color: #7d8797;
    background: #10141c; border-bottom: 1px solid #232a36; min-height: 18px; }
  #proxy iframe { border: 0; flex: 1; width: 100%; background: #fff; }
</style>
</head>
<body>
  <!-- Default view: fake "server not found" error -->
  <div id="error">
    <div class="wrap">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="1.5">
        <path d="M4 5h16v11H4z"/><path d="M4 16l4-4 3 3 3-4 6 5"/><circle cx="9" cy="9" r="1.4" fill="#5f6368" stroke="none"/>
        <line x1="3" y1="3" x2="21" y2="21" stroke="#c33" stroke-width="1.5"/>
      </svg>
      <h1>This site can’t be reached</h1>
      <p><b id="host">this site</b>’s server IP address could not be found.</p>
      <p>Try:</p>
      <p style="margin-left:14px">• Checking the connection<br>• Checking the proxy and the firewall</p>
      <p class="code">DNS_PROBE_FINISHED_NXDOMAIN</p>
      <button class="btn" onclick="location.reload()">Reload</button>
      <p class="hint" id="hint">&nbsp;</p>
    </div>
  </div>

  <!-- Shown briefly after the correct code is entered -->
  <div id="accepted" hidden>
    <div class="ring"></div>
    <div class="msg">Access accepted</div>
  </div>

  <!-- The real proxy, revealed only after unlock -->
  <div id="proxy" hidden>
    <div class="bar">
      <span class="brand">SCRAMJET</span>
      <form id="nav">
        <input id="addr" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
      </form>
    </div>
    <div class="url" id="frameurl"></div>
    <iframe id="frame" allowfullscreen></iframe>
  </div>

  <script src="/bootstrap-init.js"></script>
  <script src="/index.js"></script>
</body>
</html>
